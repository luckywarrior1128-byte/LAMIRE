.sub{position:absolute;left:4%;right:4%;bottom:3%;text-align:center;background:rgba(0,0,0,.55);border-radius:6px;padding:4px 8px;font-size:clamp(.72rem,2.4vw,.95rem);line-height:1.35;max-height:16%;overflow:hidden}

</style>

const st={cls:10,subj:"Maths",chap:null,tab:"study"};

const save=()=>{try{localStorage.setItem("pp:prog",JSON.stringify(prog))}catch(e){}};
const key=()=>`${st.cls}|${st.subj}|${st.chap}`;

// After you deploy worker.js, put its address here, e.g. "https://lamire-ai.yourname.workers.dev"
const PROXY_URL=(u=>{u=u.trim();return u&&!/^https?:\/\//.test(u)?"https://"+u:u})("https://gentle-field-0b5c.luckywarrior1128.workers.dev");
let sample=null,platform=null;
const KEY=()=>{try{return localStorage.getItem("pp:key")||""}catch(e){return ""}};
function mkShim(key){
 const f=async(msgs,opt)=>{
  let r;try{r=await fetch(PROXY_URL||"https://api.anthropic.com/v1/messages",{method:"POST",headers:PROXY_URL?{"content-type":"application/json"}:{"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:"claude-haiku-4-5-20251001",max_tokens:2500,messages:msgs})})}catch(e){throw Object.assign(new Error("network"),{code:"network"})}
  if(!r.ok)throw Object.assign(new Error("http "+r.status),{code:r.status===429?"rate_limited":r.status===401?"bad_key":"error"});
  const d=await r.json(),t=(d.content||[]).map(x=>x.text||"").join("");
  if(opt&&opt.onText)opt.onText({text:t});return t};
 f.json=async p=>{const t=(await f([{role:"user",content:p}])).replace(/```json|```/g,"");const a=t.search(/[\[{]/),z=Math.max(t.lastIndexOf("}"),t.lastIndexOf("]"));return JSON.parse(t.slice(a,z+1))};
 return f}

async function runAsk(){
 const q=$("#q").value.trim();if(!q)return;
 const out=$("#out"),b=$("#go");b.disabled=true;out.textContent="Thinking...";
 try{await sample([{role:"user",content:`You are a patient tutor for CBSE students. Context: ${ctxLabel()}. Explain in simple language, step by step, in the style of NCERT textbooks. Show working for any calculation. Do not quote textbook text word for word. End with one short check-yourself question.\n\nStudent's doubt: ${q}`}],{cache:false,onText:({text})=>{out.textContent=text}})}
 catch(e){out.innerHTML=`<span class="err">${e.code==="rate_limited"?"Too many requests. Wait a minute and try again.":e.code==="bad_key"?"Your API key was rejected. Check it and save again.":e.code==="not_granted"?"Permission was declined, so the helper can't answer.":e.code==="network"?"Could not reach the AI server. Check your internet and the Worker address.":"Something went wrong"+(e.code==="error"&&e.message?" ("+e.message+")":"")+". Try again."}</span>`}
 b.disabled=false;
}
async function runQuiz(){
 const box=$("#qz"),b=$("#mk");b.disabled=true;box.innerHTML='<p class="note">Writing questions...</p>';
 try{
  const qs=await sample.json(`Write 5 multiple-choice questions for CBSE ${ctxLabel()}, at NCERT level, original wording. Return only JSON: an array of 5 objects {"q":string,"options":[4 strings],"answer":index 0-3,"why":one-sentence explanation}.`,{cache:false});
  let score=0,done=0;
  box.innerHTML=qs.map((x,i)=>`<div class="card" data-i="${i}"><b>${i+1}. ${esc(x.q)}</b>${x.options.map((o,j)=>`<button class="opt" data-j="${j}">${esc(o)}</button>`).join("")}<div class="why" hidden>${esc(x.why)}</div></div>`).join("")+'<p id="res" class="note"></p>';
  box.onclick=e=>{const o=e.target.closest(".opt"),c=e.target.closest(".card");if(!o||c.dataset.d)return;c.dataset.d=1;
   const x=qs[c.dataset.i],j=+o.dataset.j;c.querySelectorAll(".opt").forEach((el,k)=>{if(k===x.answer)el.classList.add("ok");else if(k===j)el.classList.add("no")});
   c.querySelector(".why").hidden=false;if(j===x.answer)score++;done++;
   if(done===qs.length){$("#res").innerHTML=`<b>You scored ${score}/5.</b>`;if(st.chap){const k=key();if(prog[k]==null||score>prog[k]){prog[k]=score;save()}}}};
 }catch(e){box.innerHTML=`<span class="err">Could not make a quiz. Try again.</span>`}
 b.disabled=false;
}


/* Video lesson: AI-written, narrated, animated scenes with a tutor, captions and check questions */
const LS={d:null,i:0,on:false,voice:true,cc:true,rate:1,t:null,tk:0};
const PAL=[["#0b3d5c","#1f8a9e"],["#3b1d63","#c2547c"],["#173b2f","#4da36b"],["#5b2a0e","#e0933a"],["#1a2a5e","#5b7be0"]];
const WORDS=s=>s.narration.split(/\s+/).filter(Boolean);
const dur=k=>WORDS(LS.d.scenes[k]).length/(2.5*LS.rate)+4;
const fmt=x=>{const t=Math.round(x);return Math.floor(t/60)+":"+String(t%60).padStart(2,"0")};
function stopLesson(){clearTimeout(LS.t);LS.tk++;try{speechSynthesis.cancel()}catch(e){};const p=$("#pres");if(p)p.classList.remove("talk")}
function lessonUI(){
 if(!sample)return noAI();
 return `<p class="note">Lesson on: ${esc(ctxLabel())}. A narrated, animated lesson written by AI: a tutor talks, captions follow along, and a question comes after each scene. It is not a recorded video.</p><p><button class="btn alt" id="mkl">Create lesson</button></p><div id="lp"></div>`;
}
async function mkLesson(){
 const b=$("#mkl"),p=$("#lp");b.disabled=true;p.innerHTML='<p class="note">Writing your lesson...</p>';stopLesson();LS.on=false;
 try{LS.d=await sample.json(`Write a 5-scene video lesson for a CBSE student on ${ctxLabel()}, NCERT level, original wording, engaging like a good teacher. Return only JSON: {"title":string,"scenes":[{"emoji":one emoji that fits the scene,"heading":string,"narration":three short spoken sentences,"points":[3 short phrases],"flow":[3 or 4 very short labels showing a process or cause and effect],"fact":one short key takeaway,"check":{"q":string,"options":[3 strings],"answer":index 0-2}}]}`,{cache:false});LS.i=0;drawLesson()}
 catch(e){p.innerHTML='<span class="err">Could not make the lesson. Try again.</span>'}
 b.disabled=false;
}
function drawLesson(){
 const n=LS.d.scenes.length;
 $("#lp").innerHTML=`<h2>${esc(LS.d.title)}</h2><div class="vid" id="vid"><div id="scr" class="scn" aria-live="polite"></div></div><div class="segs" id="segs">${LS.d.scenes.map((_,k)=>`<button class="seg" data-i="${k}" aria-label="Go to scene ${k+1}"><i></i></button>`).join("")}</div>
 <div class="row"><button class="btn" id="lpv">Back</button><button class="btn alt" id="lpl">Play</button><button class="btn" id="lnx">Next</button><span class="note" id="tm2"></span>
 <select id="spd" aria-label="Speed"><option value="0.75">0.75x</option><option value="1" selected>1x</option><option value="1.25">1.25x</option><option value="1.5">1.5x</option></select>
 <label class="note"><input type="checkbox" id="lcc" ${LS.cc?"checked":""}> Captions</label><label class="note"><input type="checkbox" id="lvc" ${LS.voice?"checked":""}> Voice</label><button class="btn" id="lfs">Full screen</button></div>`;
 const go=k=>{if(k>=0&&k<n){stopLesson();LS.i=k;scene()}};
 $("#lpv").onclick=()=>go(LS.i-1);$("#lnx").onclick=()=>go(LS.i+1);
 $("#segs").onclick=e=>{const b=e.target.closest(".seg");if(b)go(+b.dataset.i)};
 $("#lpl").onclick=()=>{LS.on=!LS.on;stopLesson();$("#lpl").textContent=LS.on?"Pause":"Play";if(LS.on)scene()};
 $("#lvc").onchange=e=>{LS.voice=e.target.checked};
 $("#lcc").onchange=e=>{LS.cc=e.target.checked;$("#vid").classList.toggle("nocc",!LS.cc)};
 $("#spd").onchange=e=>{LS.rate=+e.target.value;if(LS.on){stopLesson();scene()}else vprog(0)};
 $("#lfs").onclick=()=>{try{const v=$("#vid");(v.requestFullscreen||v.webkitRequestFullscreen).call(v)}catch(e){}};
 scene();
}
function vprog(f){
 const n=LS.d.scenes.length;let before=0,total=0;
 for(let k=0;k<n;k++){const d=dur(k);if(k<LS.i)before+=d;total+=d}
 document.querySelectorAll(".seg i").forEach((el,k)=>{el.style.width=(k<LS.i?100:k===LS.i?f*100:0)+"%"});
 $("#tm2").textContent=fmt(before+f*dur(LS.i))+" / "+fmt(total);
}
function scene(){
 const s=LS.d.scenes[LS.i],p=PAL[LS.i%PAL.length],w=WORDS(s),tk=++LS.tk,vid=$("#vid"),scr=$("#scr");
 vid.classList.toggle("nocc",!LS.cc);
 scr.className="";void scr.offsetWidth;scr.className="scn";
 scr.innerHTML=`<div class="bgfx" style="background:linear-gradient(135deg,${p[0]},${p[1]})"><b></b><b></b></div><div class="art"><div class="em">${esc(s.emoji)}</div></div>
 <div class="pres" id="pres"><div class="face"><i></i><i></i><u></u></div><span>Tutor</span></div>
 <div class="lower"><h3>${esc(s.heading)}</h3><ul>${(s.points||[]).map((x,k)=>`<li style="animation-delay:${.6+k*1.1}s">${esc(x)}</li>`).join("")}</ul></div>
 <div class="info">${s.flow&&s.flow.length?`<div class="flow">${s.flow.map((x,k)=>`<span style="animation-delay:${1.2+k*.9}s">${esc(x)}</span>`).join("<em>→</em>")}</div>`:""}${s.fact?`<div class="rem">Remember: ${esc(s.fact)}</div>`:""}</div>
 <div class="sub" id="sub">${w.map(x=>`<span>${esc(x)}</span>`).join(" ")}</div><div class="chk" id="chk"></div>`;
 vprog(0);
 if(!LS.on)return;
 let idx=-1,speaking=false;
 const mark=k=>{idx=Math.max(-1,Math.min(k,w.length-1));[...$("#sub").children].forEach((el,j)=>el.classList.toggle("on",j<=idx));vprog((idx+1)/w.length)};
 const done=()=>{if(tk!==LS.tk)return;$("#pres").classList.remove("talk");LS.t=setTimeout(()=>{if(tk===LS.tk)askCheck(s)},600)};
 const tick=()=>{if(tk!==LS.tk)return;if(idx<w.length-1){mark(idx+1);LS.t=setTimeout(tick,Math.round(400/LS.rate))}else if(!speaking)done()};
 $("#pres").classList.add("talk");
 if(LS.voice&&window.speechSynthesis){
  const u=new SpeechSynthesisUtterance(s.narration);u.rate=LS.rate;speaking=true;
  u.onboundary=e=>{if(tk===LS.tk&&e.name==="word")mark(s.narration.slice(0,e.charIndex).split(/\s+/).filter(Boolean).length)};
  u.onend=u.onerror=()=>{speaking=false;if(tk===LS.tk){mark(w.length-1);done()}};
  speechSynthesis.speak(u);
 }
 tick();
}
function askCheck(s){
 const c=s.check,box=$("#chk");
 if(!c)return advance();
 box.innerHTML=`<p><b>Quick check: ${esc(c.q)}</b></p>`+c.options.map((o,j)=>`<button class="opt" data-j="${j}">${esc(o)}</button>`).join("");
 box.onclick=e=>{const o=e.target.closest(".opt");if(!o||box.dataset.d)return;box.dataset.d=1;
  box.querySelectorAll(".opt").forEach((el,k)=>{if(k===c.answer)el.classList.add("ok");else if(k===+o.dataset.j)el.classList.add("no")});
  if(LS.on)LS.t=setTimeout(advance,2200)};
}
function advance(){
 if(LS.i<LS.d.scenes.length-1){LS.i++;scene()}
 else{LS.on=false;$("#lpl").textContent="Replay";$("#chk").innerHTML="<p><b>Lesson complete. Try the Practice tab next.</b></p>";LS.i=0}
}
/* Focus sounds: generated in the browser, no downloads */
let AC=null,SRC=null,GN=null,sndT=null;const SND={type:null,vol:.5,min:0};
function mkBuf(type){const n=AC.sampleRate*4,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);let l=0,b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
 for(let i=0;i<n;i++){const w=Math.random()*2-1;
  if(type==="pink"){b0=.99886*b0+w*.0555179;b1=.99332*b1+w*.0750759;b2=.969*b2+w*.153852;b3=.8665*b3+w*.3104856;b4=.55*b4+w*.5329522;b5=-.7616*b5-w*.016898;d[i]=(b0+b1+b2+b3+b4+b5+b6+w*.5362)*.11;b6=w*.115926}
  else if(type==="white")d[i]=w*.5;else{l=(l+.02*w)/1.02;d[i]=l*3.5}}
 return b}
function stopSnd(){if(SRC)SRC.forEach(x=>{try{x.stop()}catch(e){}});SRC=null;SND.type=null;clearTimeout(sndT)}
function playSnd(type){
 stopSnd();AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume();
 const s=AC.createBufferSource();s.buffer=mkBuf(type==="ocean"?"brown":type);s.loop=true;GN=AC.createGain();GN.gain.value=SND.vol;
 if(type==="ocean"){const f=AC.createBiquadFilter();f.type="lowpass";f.frequency.value=700;const sw=AC.createGain();sw.gain.value=.5;const lfo=AC.createOscillator();lfo.frequency.value=.12;const dp=AC.createGain();dp.gain.value=.45;lfo.connect(dp);dp.connect(sw.gain);s.connect(f);f.connect(sw);sw.connect(GN);lfo.start();SRC=[s,lfo]}
 else{s.connect(GN);SRC=[s]}
 GN.connect(AC.destination);s.start();SND.type=type;
 if(SND.min)sndT=setTimeout(()=>{stopSnd();if(st.tab==="sound")render()},SND.min*60000);
}
function soundUI(){
 const T=[["white","White noise"],["pink","Pink noise"],["brown","Brown noise"],["ocean","Ocean waves"]];
 return `<p class="note">Steady background sound to help you focus. Sounds are made in your browser.</p><div class="row">${T.map(t=>`<button class="snd" data-s="${t[0]}" aria-pressed="${SND.type===t[0]}">${t[1]}</button>`).join("")}</div>
 <div class="row"><label>Volume <input type="range" id="vol" min="0" max="1" step="0.05" value="${SND.vol}"></label>
 <label>Sleep timer <select id="tm">${[0,15,30,60].map(m=>`<option value="${m}" ${SND.min===m?"selected":""}>${m?m+" min":"Off"}</option>`).join("")}</select></label>
 <button class="btn" id="off">Stop</button></div>`;
}
function bindSound(el){
 el.querySelectorAll(".snd").forEach(b=>b.onclick=()=>{playSnd(b.dataset.s);render()});
 $("#vol").oninput=e=>{SND.vol=+e.target.value;if(GN)GN.gain.value=SND.vol};
 $("#tm").onchange=e=>{SND.min=+e.target.value;if(SND.type)playSnd(SND.type)};
 $("#off").onclick=()=>{stopSnd();render()};
}

function render(){
 document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.t===st.tab));
 ["study","lesson","ask","quiz","sound","plan"].forEach(t=>$("#"+t).hidden=t!==st.tab);
 const el=$("#"+st.tab);
 if(st.tab==="study"){el.innerHTML=study();el.querySelectorAll(".chap").forEach(b=>b.onclick=()=>{st.chap=b.dataset.c;render()})}
 if(st.tab==="ask"){el.innerHTML=askUI();const g=$("#go");if(g)g.onclick=runAsk}
 if(st.tab==="quiz"){el.innerHTML=quizUI();const m=$("#mk");if(m)m.onclick=runQuiz}
 if(st.tab==="lesson"){el.innerHTML=lessonUI();const m=$("#mkl");if(m)m.onclick=mkLesson;LS.d=null;stopLesson();LS.on=false}
 if(st.tab==="sound"){el.innerHTML=soundUI();bindSound(el)}
 if(st.tab!=="lesson"){stopLesson();LS.on=false}
 if(st.tab==="plan")el.innerHTML=plan();
 const kb=$("#aks");if(kb)kb.onclick=()=>{const v=$("#ak").value.trim();if(!v)return;try{localStorage.setItem("pp:key",v)}catch(e){}pick();render()};
}
render();
